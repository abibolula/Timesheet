<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cek instalasi · Timekeeper</title><link rel="icon" href="./icons/logo.svg" type="image/svg+xml"><style>body{max-width:700px;margin:40px auto;padding:20px;font:16px/1.6 system-ui;background:#f4efe6;color:#252923}h1{font-family:Georgia}button,a{color:#344c3c}button{padding:12px 20px;cursor:pointer}li{margin:12px 0;overflow-wrap:anywhere}small{display:block}img{width:64px;height:64px}</style></head><body><img src="./icons/icon-192.png" alt="Logo Timekeeper"><h1>Cek instalasi aplikasi</h1><p>Jalankan pemeriksaan ini pada alamat hosting yang dibuka di HP.</p><button id="check">Periksa sekarang</button><ul id="results" aria-live="polite"></ul><p>Lolos pemeriksaan file belum menjamin pemasangan pada semua perangkat. Chrome menentukan ketersediaan menu Install.</p><a href="./index.html">Kembali ke Timekeeper</a><script>
const list=document.getElementById('results'),button=document.getElementById('check');
function result(ok,text){const item=document.createElement('li');item.textContent=(ok?'✓ ':'✕ ')+text;list.append(item);}
async function get(path){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);try{const r=await fetch(path,{cache:'no-store',signal:controller.signal});if(!r.ok)throw Error(path+': HTTP '+r.status);return r;}finally{clearTimeout(timer);}}
button.onclick=async()=>{button.disabled=true;list.replaceChildren();result(isSecureContext&&location.protocol!=='file:','HTTPS / lingkungan aman: '+location.origin);try{const response=await get('./manifest.webmanifest'),manifest=await response.json();result(!!(manifest.name&&manifest.start_url&&manifest.display==='standalone'),'Manifest terbaca: '+manifest.name);for(const size of ['192x192','512x512']){const icon=manifest.icons.find(i=>i.sizes===size&&(!i.purpose||i.purpose.includes('any')));if(!icon){result(false,'Ikon '+size+' tidak ditemukan');continue;}const url=new URL(icon.src,response.url),r=await get(url);const blob=await r.blob(),bitmap=await createImageBitmap(blob);result(bitmap.width+'x'+bitmap.height===size,'Ikon '+size+': '+r.headers.get('Content-Type'));bitmap.close();}const entry=await get(new URL(manifest.start_url,response.url));result((entry.headers.get('Content-Type')||'').includes('text/html'),'Halaman awal dapat diakses');const worker=await get('./sw.js');result(/javascript/.test(worker.headers.get('Content-Type')||''),'Service worker memiliki tipe JavaScript');if('serviceWorker' in navigator){const reg=await navigator.serviceWorker.register('./sw.js',{scope:'./',updateViaCache:'none'});result(true,'Service worker terdaftar: '+reg.scope);}else result(false,'Browser tidak mendukung service worker');}catch(error){result(false,error.name==='AbortError'?'Pemeriksaan melebihi 15 detik. Periksa koneksi.':error.message);}finally{button.disabled=false;}};
</script></body></html>
