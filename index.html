<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kartu Waktu — Absensi Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700;900&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE5CB;
    --paper-dark:#E1D1A8;
    --wood-dark:#221809;
    --wood:#2E2013;
    --brass-hi:#E7C983;
    --brass:#B9924F;
    --brass-dk:#7C5F30;
    --ink:#2A1F16;
    --ink-muted:#6B5A44;
    --stamp-red:#963A2A;
    --ledger-green:#3F5C42;
    --item-h:38px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    height:100dvh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px;
    font-family:'Courier Prime', 'Courier New', monospace;
    color:var(--ink);
    background-color:var(--wood-dark);
    background-image:
      radial-gradient(ellipse at 50% 20%, rgba(255,220,160,0.05), transparent 60%),
      repeating-linear-gradient(112deg, #2b1e10 0px, #2b1e10 2px, #241909 2px, #241909 5px);
  }

  .app{ width:100%; max-width:420px; height:100%; display:flex; flex-direction:column; }

  .card{
    position:relative;
    width:100%; height:100%;
    display:flex; flex-direction:column;
    background-color:var(--paper);
    background-image: radial-gradient(rgba(0,0,0,0.045) 1px, transparent 1.2px);
    background-size: 3px 3px;
    border-radius:3px;
    box-shadow:
      0 0 0 1px var(--brass-dk),
      0 0 0 5px var(--wood),
      0 14px 30px rgba(0,0,0,0.45);
    overflow:hidden;
  }

  .plate{
    position:relative; flex:0 0 auto;
    padding:10px 18px 8px;
    text-align:center;
    background:linear-gradient(160deg, var(--brass-hi), var(--brass) 55%, var(--brass-dk) 100%);
    border-bottom:3px solid var(--wood);
  }
  .plate h1{
    margin:0;
    font-family:'Bitter', serif;
    font-weight:900;
    font-size:1.18rem;
    letter-spacing:0.12em;
    color:var(--ink);
    text-shadow:0 1px 0 rgba(255,255,255,0.35), 0 -1px 0 rgba(0,0,0,0.25);
  }
  .plate p{
    margin:3px 0 0;
    font-size:0.62rem;
    letter-spacing:0.07em;
    color:var(--ink);
    opacity:0.75;
  }
  .rivet{
    position:absolute; width:7px; height:7px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #F5E4B8, #6E5528 72%, #45350F);
    box-shadow:0 1px 1px rgba(0,0,0,0.6);
  }
  .rivet.tl{top:7px; left:9px;} .rivet.tr{top:7px; right:9px;}
  .rivet.bl{bottom:7px; left:9px;} .rivet.br{bottom:7px; right:9px;}

  .gear-btn{
    position:absolute; bottom:7px; right:8px;
    width:15px; height:15px; border-radius:50%;
    border:1px solid var(--wood);
    background:radial-gradient(circle at 32% 30%, #F5E4B8, var(--brass-dk) 80%);
    color:var(--ink); font-size:0.68rem; line-height:1; cursor:pointer; padding:0;
  }

  .status-bar{
    flex:0 0 auto;
    padding:8px 16px;
    border-bottom:1px dashed var(--brass-dk);
    display:flex; align-items:center; justify-content:space-between; gap:8px;
  }
  .status-bar .date-label{
    font-size:0.68rem; color:var(--ink-muted); letter-spacing:0.01em;
  }
  .status-pill{
    display:inline-flex; align-items:center; gap:5px;
    font-size:0.65rem; font-weight:700; letter-spacing:0.03em;
    padding:4px 9px; border-radius:2px;
    border:1px solid var(--brass-dk);
    background:var(--paper-dark);
    white-space:nowrap;
  }
  .status-pill .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-muted);}
  .status-pill.in .dot{background:var(--stamp-red);}
  .status-pill.done .dot{background:var(--ledger-green);}
  .status-pill.done{color:var(--ledger-green); border-color:var(--ledger-green);}
  .status-pill.in{color:var(--stamp-red); border-color:var(--stamp-red);}

  .tabs{ flex:0 0 auto; display:flex; }
  .tab{
    flex:1; padding:10px 8px; text-align:center;
    font-family:'Bitter', serif; font-weight:700; font-size:0.76rem; letter-spacing:0.07em;
    cursor:pointer; user-select:none;
    background:var(--paper-dark);
    color:var(--ink-muted);
    border-bottom:3px solid var(--brass-dk);
    transition:background .15s, color .15s;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    border-bottom:3px solid var(--stamp-red);
  }
  .tab:first-child{ border-right:1px dashed var(--brass-dk); }

  .panel{
    flex:1 1 auto; min-height:0; overflow-y:auto;
    display:flex; flex-direction:column;
    padding:14px 18px calc(14px + env(safe-area-inset-bottom));
  }
  .panel-hidden{ display:none; }

  .field{ margin-bottom:12px; }
  .field:last-of-type{ margin-bottom:0; }
  .field label{
    display:block; font-size:0.66rem; color:var(--ink-muted);
    letter-spacing:0.05em; margin-bottom:5px;
  }
  input[type="date"], input[type="text"], textarea{
    width:100%; padding:8px 10px;
    font-family:'Courier Prime', monospace; font-size:0.86rem; color:var(--ink);
    background:var(--paper-dark);
    border:1px solid var(--brass-dk);
    border-radius:2px;
    outline:none;
  }
  input[type="date"]:focus, input[type="text"]:focus, textarea:focus{
    border-color:var(--stamp-red);
  }
  textarea{ min-height:52px; resize:vertical; line-height:1.4; flex:1; }

  .hint-line{
    font-size:0.65rem; color:var(--ink-muted); margin-top:5px; line-height:1.4;
  }
  .hint-line.warn{ color:var(--stamp-red); }
  .hint-line.ok{ color:var(--ledger-green); }

  /* --- Wheel time picker (split-flap style) --- */
  .time-picker{
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .wheel-col{ position:relative; width:66px; }
  .wheel-btn{
    width:100%; padding:3px 0; text-align:center;
    background:var(--paper-dark); border:1px solid var(--brass-dk); border-radius:2px;
    color:var(--brass-dk); cursor:pointer; font-size:0.62rem; line-height:1;
  }
  .wheel-btn.up{ margin-bottom:3px; }
  .wheel-btn.down{ margin-top:3px; }
  .wheel-btn:active{ background:var(--brass-dk); color:var(--paper); }

  .wheel{
    height:calc(var(--item-h) * 3);
    overflow-y:scroll;
    scroll-snap-type:y mandatory;
    padding:var(--item-h) 0;
    background:var(--wood-dark);
    border:2px solid var(--wood);
    border-radius:2px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    position:relative;
  }
  .wheel::-webkit-scrollbar{ display:none; }
  .wheel-item{
    height:var(--item-h);
    display:flex; align-items:center; justify-content:center;
    font-family:'Courier Prime', monospace; font-weight:700; font-size:1.3rem;
    color:var(--paper-dark); opacity:0.28;
    scroll-snap-align:center;
    transition:opacity .1s, transform .1s;
  }
  .wheel-item.active{ opacity:1; color:var(--brass-hi); transform:scale(1.06); }
  .wheel-window{
    position:absolute; left:2px; right:2px; top:50%;
    height:var(--item-h); transform:translateY(-50%);
    border-top:1px solid var(--brass); border-bottom:1px solid var(--brass);
    pointer-events:none;
  }
  .wheel-sep{
    font-family:'Bitter', serif; font-weight:900; font-size:1.3rem; color:var(--ink);
    align-self:center;
  }

  .spacer{ flex:1; }

  .btn-submit{
    width:100%; margin-top:10px; padding:11px;
    font-family:'Bitter', serif; font-weight:700; font-size:0.84rem; letter-spacing:0.09em;
    color:var(--paper);
    background:linear-gradient(180deg, #4a3220, var(--wood-dark));
    border:1px solid var(--wood-dark);
    border-radius:2px;
    cursor:pointer;
    flex:0 0 auto;
    transition:transform .08s;
  }
  .btn-submit:active{ transform:scale(0.98); }
  .btn-submit.out{ background:linear-gradient(180deg, #5a2c22, var(--wood-dark)); }
  .btn-submit[disabled]{ opacity:0.55; cursor:progress; }

  .stamp-flash{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:50;
  }
  .stamp-flash span{
    font-family:'Bitter', serif; font-weight:900; font-size:1.25rem; letter-spacing:0.07em;
    color:var(--stamp-red);
    border:4px solid var(--stamp-red);
    padding:12px 22px; border-radius:4px;
    transform:rotate(-6deg) scale(1.4);
    opacity:0;
    background:rgba(239,229,203,0.94);
  }
  .stamp-flash.show span{ animation:stampIn .5s ease-out forwards; }
  @keyframes stampIn{
    0%{ opacity:0; transform:rotate(-6deg) scale(1.8); }
    45%{ opacity:1; transform:rotate(-6deg) scale(0.96); }
    75%{ transform:rotate(-6deg) scale(1.04); }
    100%{ opacity:1; transform:rotate(-6deg) scale(1); }
  }

  .msg{
    margin-top:8px; padding:7px 9px; border-radius:2px;
    font-size:0.72rem; line-height:1.35; display:none; flex:0 0 auto;
  }
  .msg.show{ display:block; }
  .msg.error{ background:#F3DCD5; border:1px solid var(--stamp-red); color:var(--stamp-red); }
  .msg.ok{ background:#DCE6DD; border:1px solid var(--ledger-green); color:var(--ledger-green); }

  /* Modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(15,10,5,0.72);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
  }
  .modal-overlay.show{ display:flex; }
  .modal{
    width:100%; max-width:360px; background:var(--paper);
    border:1px solid var(--brass-dk); border-radius:3px;
    box-shadow:0 0 0 6px var(--wood);
    padding:18px;
    max-height:90vh; overflow-y:auto;
  }
  .modal h2{
    margin:0 0 4px; font-family:'Bitter', serif; font-size:1rem; letter-spacing:0.04em;
  }
  .modal p.hint{ margin:0 0 14px; font-size:0.72rem; color:var(--ink-muted); line-height:1.5; }
  .modal .field{ margin-bottom:12px; }
  .modal-actions{ display:flex; gap:10px; margin-top:4px; }
  .modal-actions button{
    flex:1; padding:10px; border-radius:2px; cursor:pointer;
    font-family:'Bitter', serif; font-weight:700; font-size:0.8rem; letter-spacing:0.04em;
  }
  .btn-save{ background:var(--wood-dark); color:var(--paper); border:1px solid var(--wood-dark); }
  .btn-cancel{ background:var(--paper-dark); color:var(--ink); border:1px solid var(--brass-dk); }
</style>
</head>
<body>

<div class="app">
  <div class="card">
    <div class="plate">
      <div class="rivet tl"></div><div class="rivet tr"></div>
      <div class="rivet bl"></div><div class="rivet br"></div>
      <h1>KARTU WAKTU</h1>
      <p>Sistem Absensi Digital &middot; Gaya Klasik</p>
      <button class="gear-btn" id="btnSettings" title="Pengaturan">&#9881;</button>
    </div>

    <div class="status-bar">
      <div class="date-label" id="statusDate">—</div>
      <div class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">Memuat…</span></div>
    </div>

    <div class="tabs">
      <div class="tab active" data-tab="in">CLOCK IN</div>
      <div class="tab" data-tab="out">CLOCK OUT</div>
    </div>

    <!-- CLOCK IN -->
    <div class="panel" id="panelIn">
      <div class="field">
        <label for="inDate">Tanggal</label>
        <input type="date" id="inDate">
        <div class="hint-line" id="inHint"></div>
      </div>

      <div class="field">
        <label>Pukul masuk</label>
        <div class="time-picker">
          <div class="wheel-col">
            <button class="wheel-btn up" data-wheel="inHour" data-dir="-1">&#9650;</button>
            <div class="wheel" id="inHour" tabindex="0"><div class="wheel-window"></div></div>
            <button class="wheel-btn down" data-wheel="inHour" data-dir="1">&#9660;</button>
          </div>
          <div class="wheel-sep">:</div>
          <div class="wheel-col">
            <button class="wheel-btn up" data-wheel="inMinute" data-dir="-1">&#9650;</button>
            <div class="wheel" id="inMinute" tabindex="0"><div class="wheel-window"></div></div>
            <button class="wheel-btn down" data-wheel="inMinute" data-dir="1">&#9660;</button>
          </div>
        </div>
      </div>

      <div class="field">
        <label for="inNama">Nama (opsional)</label>
        <input type="text" id="inNama" placeholder="mis. Rasyid">
      </div>

      <div class="spacer"></div>
      <button class="btn-submit" id="btnClockIn">STEMPEL MASUK</button>
      <div class="msg" id="inMsg"></div>
    </div>

    <!-- CLOCK OUT -->
    <div class="panel panel-hidden" id="panelOut">
      <div class="field">
        <label for="outDate">Tanggal</label>
        <input type="date" id="outDate">
        <div class="hint-line" id="outHint"></div>
      </div>

      <div class="field">
        <label>Pukul keluar</label>
        <div class="time-picker">
          <div class="wheel-col">
            <button class="wheel-btn up" data-wheel="outHour" data-dir="-1">&#9650;</button>
            <div class="wheel" id="outHour" tabindex="0"><div class="wheel-window"></div></div>
            <button class="wheel-btn down" data-wheel="outHour" data-dir="1">&#9660;</button>
          </div>
          <div class="wheel-sep">:</div>
          <div class="wheel-col">
            <button class="wheel-btn up" data-wheel="outMinute" data-dir="-1">&#9650;</button>
            <div class="wheel" id="outMinute" tabindex="0"><div class="wheel-window"></div></div>
            <button class="wheel-btn down" data-wheel="outMinute" data-dir="1">&#9660;</button>
          </div>
        </div>
      </div>

      <div class="field" style="flex:1; display:flex; flex-direction:column;">
        <label for="outTask">Tugas yang sudah dikerjakan</label>
        <textarea id="outTask" placeholder="Tulis ringkasan pekerjaan hari ini…"></textarea>
      </div>

      <button class="btn-submit out" id="btnClockOut">STEMPEL KELUAR</button>
      <div class="msg" id="outMsg"></div>
    </div>
  </div>
</div>

<div class="stamp-flash" id="stampFlash"><span id="stampFlashText">TERCATAT</span></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>Pengaturan Koneksi</h2>
    <p class="hint">Tempel URL Web App Google Apps Script yang sudah di-deploy, supaya kartu waktu ini bisa membaca &amp; menulis ke Google Sheet Anda.</p>
    <div class="field">
      <label for="cfgUrl">URL Apps Script (.../exec)</label>
      <input type="text" id="cfgUrl" placeholder="https://script.google.com/macros/s/…/exec">
    </div>
    <div class="field">
      <label for="cfgNama">Nama default (opsional)</label>
      <input type="text" id="cfgNama" placeholder="mis. Rasyid">
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" id="btnModalCancel">Nanti saja</button>
      <button class="btn-save" id="btnModalSave">Simpan</button>
    </div>
  </div>
</div>

<script>
(function(){
  const ITEM_H = 38;
  const pad2 = n => String(n).padStart(2,'0');
  const todayStr = () => {
    const d = new Date();
    return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
  };
  const fmtLong = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
  };
  const fmtShort = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00');
    return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
  };

  let settings = JSON.parse(localStorage.getItem('kartuWaktuSettings') || '{}');

  // ---------- Wheel picker ----------
  function buildWheel(el, count, initial, onChange){
    el.querySelectorAll('.wheel-item').forEach(n => n.remove());
    const frag = document.createDocumentFragment();
    for(let i=0;i<count;i++){
      const item = document.createElement('div');
      item.className = 'wheel-item';
      item.textContent = pad2(i);
      item.dataset.value = i;
      frag.appendChild(item);
    }
    el.appendChild(frag);
    const items = () => el.querySelectorAll('.wheel-item');
    let current = initial;

    function scrollToIdx(i, smooth){
      el.scrollTo({ top: i*ITEM_H, behavior: smooth ? 'smooth' : 'auto' });
    }
    function paintActive(i){
      items().forEach((it, idx) => it.classList.toggle('active', idx === i));
    }
    function settle(){
      const idx = Math.max(0, Math.min(count-1, Math.round(el.scrollTop / ITEM_H)));
      current = idx;
      scrollToIdx(idx, true);
      paintActive(idx);
      onChange(idx);
    }
    let t;
    el.addEventListener('scroll', () => {
      const idx = Math.max(0, Math.min(count-1, Math.round(el.scrollTop / ITEM_H)));
      paintActive(idx);
      clearTimeout(t);
      t = setTimeout(settle, 90);
    }, { passive:true });
    el.addEventListener('click', (e) => {
      const it = e.target.closest('.wheel-item');
      if(!it) return;
      const idx = parseInt(it.dataset.value, 10);
      current = idx;
      scrollToIdx(idx, true);
      paintActive(idx);
      onChange(idx);
    });
    el.addEventListener('keydown', (e) => {
      if(e.key === 'ArrowUp'){ e.preventDefault(); api.step(-1); }
      if(e.key === 'ArrowDown'){ e.preventDefault(); api.step(1); }
    });

    const api = {
      setValue(i, smooth){
        current = Math.max(0, Math.min(count-1, i));
        scrollToIdx(current, !!smooth);
        paintActive(current);
      },
      step(delta){
        const idx = Math.max(0, Math.min(count-1, current + delta));
        current = idx;
        scrollToIdx(idx, true);
        paintActive(idx);
        onChange(idx);
      },
      getValue(){ return current; }
    };
    requestAnimationFrame(() => api.setValue(initial, false));
    return api;
  }

  const now = new Date();
  const wheels = {
    inHour:   buildWheel(document.getElementById('inHour'), 24, now.getHours(), () => {}),
    inMinute: buildWheel(document.getElementById('inMinute'), 60, now.getMinutes(), () => {}),
    outHour:  buildWheel(document.getElementById('outHour'), 24, now.getHours(), () => {}),
    outMinute:buildWheel(document.getElementById('outMinute'), 60, now.getMinutes(), () => {}),
  };
  document.querySelectorAll('.wheel-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      wheels[btn.dataset.wheel].step(parseInt(btn.dataset.dir, 10));
    });
  });

  // ---------- Tabs ----------
  const tabs = document.querySelectorAll('.tab');
  const panelIn = document.getElementById('panelIn');
  const panelOut = document.getElementById('panelOut');
  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      const isIn = tab.dataset.tab === 'in';
      panelIn.classList.toggle('panel-hidden', !isIn);
      panelOut.classList.toggle('panel-hidden', isIn);
      if(isIn) reflectDate('in', document.getElementById('inDate').value);
      else reflectDate('out', document.getElementById('outDate').value);
    });
  });

  // ---------- Defaults ----------
  const inDateEl = document.getElementById('inDate');
  const outDateEl = document.getElementById('outDate');
  inDateEl.value = todayStr();
  outDateEl.value = todayStr();
  document.getElementById('inNama').value = settings.nama || '';
  document.getElementById('statusDate').textContent = fmtLong(todayStr());

  // ---------- API calls ----------
  async function apiPost(payload){
    const res = await fetch(settings.scriptUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    return res.json();
  }
  async function apiCheck(date){
    const res = await fetch(`${settings.scriptUrl}?action=check&date=${date}`);
    return res.json();
  }

  function setMsg(el, text, type){
    el.textContent = text;
    el.className = 'msg show ' + type;
  }
  function clearMsg(el){ el.className = 'msg'; }

  function stampFlash(text){
    const el = document.getElementById('stampFlash');
    document.getElementById('stampFlashText').textContent = text;
    el.classList.remove('show'); void el.offsetWidth;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 1200);
  }

  // Debounced per-date lookup so switching tabs / changing dates is instant & doesn't spam requests
  let reflectTimers = {};
  function reflectDate(mode, date){
    clearTimeout(reflectTimers[mode]);
    const hintEl = document.getElementById(mode === 'in' ? 'inHint' : 'outHint');
    if(!settings.scriptUrl){ hintEl.textContent=''; return; }
    hintEl.textContent = 'Memeriksa data…';
    hintEl.className = 'hint-line';
    reflectTimers[mode] = setTimeout(async () => {
      try{
        const r = await apiCheck(date);
        if(mode === 'in'){
          if(r.success && r.entry){
            hintEl.textContent = `Sudah tercatat masuk pukul ${r.entry.jamMasuk} untuk ${fmtShort(date)}.`;
            hintEl.className = 'hint-line warn';
          } else {
            hintEl.textContent = `Belum ada catatan untuk ${fmtShort(date)}.`;
            hintEl.className = 'hint-line';
          }
        } else {
          if(r.success && r.entry){
            const [h,m] = (r.entry.jamMasuk || '00:00').split(':').map(Number);
            hintEl.textContent = r.entry.jamKeluar
              ? `Sudah clock out pukul ${r.entry.jamKeluar}. Simpan lagi untuk memperbarui.`
              : `Masuk pukul ${r.entry.jamMasuk} — siap untuk clock out.`;
            hintEl.className = r.entry.jamKeluar ? 'hint-line warn' : 'hint-line ok';
            if(r.entry.tugas) document.getElementById('outTask').value = r.entry.tugas;
          } else {
            hintEl.textContent = `Belum ada clock in untuk ${fmtShort(date)}. Clock out belum bisa disimpan.`;
            hintEl.className = 'hint-line warn';
          }
        }
      } catch(err){
        hintEl.textContent = 'Gagal memeriksa data.';
        hintEl.className = 'hint-line warn';
      }
    }, 250);
  }

  inDateEl.addEventListener('change', () => reflectDate('in', inDateEl.value));
  outDateEl.addEventListener('change', () => reflectDate('out', outDateEl.value));

  async function refreshStatus(){
    const pill = document.getElementById('statusPill');
    const text = document.getElementById('statusText');
    if(!settings.scriptUrl){
      pill.className = 'status-pill';
      text.textContent = 'Belum terhubung';
      return;
    }
    try{
      const r = await apiCheck(todayStr());
      if(r.success && r.entry){
        if(r.entry.jamKeluar){
          pill.className = 'status-pill done';
          text.textContent = `Selesai — keluar ${r.entry.jamKeluar}`;
        } else {
          pill.className = 'status-pill in';
          text.textContent = `Masuk pukul ${r.entry.jamMasuk}`;
        }
      } else {
        pill.className = 'status-pill';
        text.textContent = 'Belum clock in';
      }
    } catch(err){
      pill.className = 'status-pill';
      text.textContent = 'Gagal memuat status';
    }
  }

  // ---------- Submit: Clock In ----------
  let submittingIn = false;
  document.getElementById('btnClockIn').addEventListener('click', async () => {
    if(submittingIn) return;
    const btn = document.getElementById('btnClockIn');
    const msg = document.getElementById('inMsg');
    clearMsg(msg);
    if(!settings.scriptUrl){ openModal(); return; }
    const date = inDateEl.value;
    const time = `${pad2(wheels.inHour.getValue())}:${pad2(wheels.inMinute.getValue())}`;
    const nama = document.getElementById('inNama').value.trim();
    settings.nama = nama; localStorage.setItem('kartuWaktuSettings', JSON.stringify(settings));

    submittingIn = true;
    btn.disabled = true; btn.textContent = 'MENYIMPAN…';
    try{
      const r = await apiPost({ action:'clockIn', date, time, nama });
      if(r.success){
        stampFlash('MASUK TERCATAT');
        setMsg(msg, `Clock in tersimpan untuk ${fmtLong(date)} pukul ${time}.`, 'ok');
        refreshStatus();
        reflectDate('in', date);
      } else {
        setMsg(msg, r.message || 'Gagal menyimpan data.', 'error');
      }
    } catch(err){
      setMsg(msg, 'Tidak dapat terhubung ke Google Sheet. Periksa URL Apps Script di pengaturan.', 'error');
    } finally {
      submittingIn = false;
      btn.disabled = false; btn.textContent = 'STEMPEL MASUK';
    }
  });

  // ---------- Submit: Clock Out ----------
  let submittingOut = false;
  document.getElementById('btnClockOut').addEventListener('click', async () => {
    if(submittingOut) return;
    const btn = document.getElementById('btnClockOut');
    const msg = document.getElementById('outMsg');
    clearMsg(msg);
    if(!settings.scriptUrl){ openModal(); return; }
    const date = outDateEl.value;
    const time = `${pad2(wheels.outHour.getValue())}:${pad2(wheels.outMinute.getValue())}`;
    const tugas = document.getElementById('outTask').value.trim();

    submittingOut = true;
    btn.disabled = true; btn.textContent = 'MENYIMPAN…';
    try{
      const r = await apiPost({ action:'clockOut', date, time, tugas });
      if(r.success){
        stampFlash('KELUAR TERCATAT');
        setMsg(msg, `Clock out tersimpan untuk ${fmtLong(date)} pukul ${time}.`, 'ok');
        refreshStatus();
        reflectDate('out', date);
      } else {
        setMsg(msg, r.message || 'Gagal menyimpan data. Pastikan sudah clock in tanggal tersebut.', 'error');
      }
    } catch(err){
      setMsg(msg, 'Tidak dapat terhubung ke Google Sheet. Periksa URL Apps Script di pengaturan.', 'error');
    } finally {
      submittingOut = false;
      btn.disabled = false; btn.textContent = 'STEMPEL KELUAR';
    }
  });

  // ---------- Settings modal ----------
  const overlay = document.getElementById('modalOverlay');
  function openModal(){
    document.getElementById('cfgUrl').value = settings.scriptUrl || '';
    document.getElementById('cfgNama').value = settings.nama || '';
    overlay.classList.add('show');
  }
  function closeModal(){ overlay.classList.remove('show'); }
  document.getElementById('btnSettings').addEventListener('click', openModal);
  document.getElementById('btnModalCancel').addEventListener('click', closeModal);
  document.getElementById('btnModalSave').addEventListener('click', () => {
    const url = document.getElementById('cfgUrl').value.trim();
    const nama = document.getElementById('cfgNama').value.trim();
    settings = { scriptUrl:url, nama:nama };
    localStorage.setItem('kartuWaktuSettings', JSON.stringify(settings));
    document.getElementById('inNama').value = nama;
    closeModal();
    refreshStatus();
    reflectDate('in', inDateEl.value);
  });

  if(!settings.scriptUrl){ openModal(); }
  refreshStatus();
  reflectDate('in', inDateEl.value);
})();
</script>
</body>
</html>
